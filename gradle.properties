org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# O Gradle home padrão fica em C:\Users\Usuário\.gradle — o acento em
# "Usuário" quebra o test worker (ClassNotFoundException:
# GradleWorkerMain), porque o classpath do worker é montado como texto na
# codepage do sistema, não em UTF-8. Compilar funciona; SÓ os testes
# quebram, o que torna o sintoma bem confuso.
#
# Não é possível corrigir isso via gradle.properties (o Gradle home é
# resolvido antes de ler este arquivo). Para rodar os testes use:
#
#     ./gradlew.bat -g "C:\dev\.gradle-home" test...
#
# ou defina GRADLE_USER_HOME=C:\dev\.gradle-home no ambiente. Qualquer
# caminho sem acento serve.
